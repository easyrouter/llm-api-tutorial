name: Release

# Produces builds for Windows and macOS.
#
# Signing is wired but dormant: each signing step is guarded by the presence of its repository
# secret (docs/RELEASE.md, OPEN_QUESTIONS Q-12). With no secrets configured this workflow behaves
# exactly as before and produces UNSIGNED artifacts that must not be handed to end users as-is.
# Adding the secrets is the only action needed to turn signing on -- no workflow edit required.
#
# `create-release` owns the release object; the matrix jobs only upload to it. Letting both
# bundle jobs create it themselves raced: on v0.1.0-test.3-patched the Windows and macOS jobs
# each created a release for the same tag within the same second, and the installer ended up on
# the duplicate that the tag did not resolve to -- a silently missing .exe.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0-test.1)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    # Secrets cannot be read from a step-level `if:`, so presence is resolved once here into
    # plain strings ("true" / "false") that the steps below can branch on.
    env:
      SIGN_WINDOWS: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      SIGN_MACOS: ${{ secrets.APPLE_CERTIFICATE != '' }}
      NOTARIZE_MACOS: ${{ secrets.APPLE_ID != '' }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Install instructions differ for signed and unsigned builds, so the release body is
      # composed here rather than hardcoded as "unsigned". Creating the release exactly once
      # also means this text is written exactly once, whoever wins the build race afterwards.
      - name: Create the release if it does not exist
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PRERELEASE_INPUT: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Re-running a release (e.g. after a failed bundle job) must top up the existing
          # release, never make a second one for the same tag.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - the bundle jobs will upload into it."
            exit 0
          fi

          cat > release-notes.md <<'__BODY__'
          **SeedRouter Onboarding** walks you from a bare machine to a working
          Codex CLI / Claude Code against the SeedRouter service gateway
          (`https://seedrouter.net/v1`): environment check → install → CC Switch
          configuration → verify → auto-diagnose. Windows + macOS, 简体中文 + English.

          No admin rights required, every command is shown before it runs, and your
          API key is never written to disk, logs or the diagnostic report.

          | platform | file |
          | --- | --- |
          | Windows 10/11 (x64) | `*-setup.exe` (per-user install, no admin) |
          | macOS 12+ (Intel + Apple silicon) | `*.dmg` (universal) |

          __BODY__

          {
            if [ "$SIGN_WINDOWS" != "true" ] || [ "$SIGN_MACOS" != "true" ]; then
              echo "Test build - **unsigned**, not for distribution."
              echo
            fi
            if [ "$SIGN_WINDOWS" = "true" ]; then
              echo "Windows: signed, so SmartScreen should stay quiet."
            else
              echo 'Windows: SmartScreen shows "Windows protected your PC" -> *More info* -> *Run anyway*.'
            fi
            if [ "$SIGN_MACOS" = "true" ] && [ "$NOTARIZE_MACOS" = "true" ]; then
              echo "macOS: signed and notarized, so Gatekeeper opens it normally."
            elif [ "$SIGN_MACOS" = "true" ]; then
              echo "macOS: signed but **not notarized**; Gatekeeper still warns on first open."
            else
              echo "macOS: Gatekeeper blocks the unsigned app - after dragging it to Applications run"
              echo '`xattr -dr com.apple.quarantine "/Applications/SeedRouter Onboarding.app"`.'
            fi
          } >> release-notes.md

          # An unsigned build is never a stable release, whatever the dispatch input asked for.
          prerelease=--prerelease
          if [ "${PRERELEASE_INPUT:-}" = "false" ] && [ "$SIGN_WINDOWS" = "true" ] && [ "$SIGN_MACOS" = "true" ]; then
            prerelease=
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SeedRouter Onboarding $TAG" \
            --notes-file release-notes.md \
            ${prerelease:+"$prerelease"}
          echo "Created release $TAG at $GITHUB_SHA."

  bundle:
    name: Bundle · ${{ matrix.label }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            args: ""
            targets: ""
          - os: macos-latest
            label: macos-universal
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    # Secrets cannot be read from a step-level `if:`, so presence is resolved once here into
    # plain strings ("true" / "false") that the steps below can branch on.
    env:
      SIGN_WINDOWS: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      SIGN_MACOS: ${{ secrets.APPLE_CERTIFICATE != '' }}
      NOTARIZE_MACOS: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # --- Signing (dormant until the matching secrets exist) -------------------------------
      # Each step writes into $GITHUB_ENV only when it runs. A skipped step leaves the variable
      # genuinely undefined rather than set-but-empty, which matters: an empty
      # APPLE_SIGNING_IDENTITY would make the bundler attempt to sign with an empty identity.

      - name: Prepare Windows code signing
        if: matrix.os == 'windows-latest' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Optional override; defaults to DigiCert's public RFC-3161 timestamper. Timestamping is
          # what keeps already-issued signatures valid after the certificate itself expires.
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          # Forward slashes: PowerShell accepts them in provider paths and this file deliberately
          # contains no backslashes, which keeps it safe to edit through any escaping layer.
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:/CurrentUser/My -Password $password
          Remove-Item $pfx -Force
          $timestamp = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          # Tauri reads the thumbprint from its config, not from the environment, so merge a
          # fragment in with `--config`. The path is absolute and slash-separated because the
          # value goes through tauri-action's argv splitter.
          $fragment = Join-Path $env:RUNNER_TEMP 'tauri.signing.conf.json'
          @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = $timestamp
          } } } | ConvertTo-Json -Depth 6 | Set-Content -Path $fragment -Encoding utf8
          $arg = '--config ' + $fragment.Replace([char]92, '/')
          "SIGNING_CONFIG_ARG=$arg" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows signing enabled (thumbprint $($cert.Thumbprint.Substring(0,8))..., timestamp $timestamp)"

      - name: Prepare macOS code signing
        if: matrix.os == 'macos-latest' && env.SIGN_MACOS == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # tauri-action imports the .p12 into a throwaway keychain itself when these are set.
          # The base64 is squeezed onto one line first: macOS `base64` wraps at 76 columns by
          # default, and a multi-line value is invalid in the NAME=value form of $GITHUB_ENV.
          # Stripping whitespace does not change what the base64 decodes to.
          {
            echo "APPLE_CERTIFICATE=$(printf '%s' "${APPLE_CERTIFICATE}" | tr -d '[:space:]')"
            echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD}"
            echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}"
          } >> "$GITHUB_ENV"
          echo "macOS signing enabled"

      - name: Prepare macOS notarization
        if: matrix.os == 'macos-latest' && env.SIGN_MACOS == 'true' && env.NOTARIZE_MACOS == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # APPLE_PASSWORD is an app-specific password, not the Apple ID account password.
          {
            echo "APPLE_ID=${APPLE_ID}"
            echo "APPLE_PASSWORD=${APPLE_PASSWORD}"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
          } >> "$GITHUB_ENV"
          echo "macOS notarization enabled"

      # `create-release` published the release already, so this only uploads assets into it.
      # Release name, body and pre-release status are deliberately not set here: they belong to
      # the single job that creates the release, and passing them again would let a re-run
      # rewrite the notes with a different job's view of the signing secrets.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseDraft: false
          includeUpdaterJson: false
          # SIGNING_CONFIG_ARG is set only by the Windows signing step; empty everywhere else.
          args: ${{ matrix.args }} ${{ env.SIGNING_CONFIG_ARG }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: |
            src-tauri/target/**/bundle/nsis/*-setup.exe
            src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: error

  verify-assets:
    name: Verify release assets
    needs: [create-release, bundle]
    runs-on: ubuntu-latest
    steps:
      # The race this workflow used to lose was silent: the run went green with an installer
      # missing from the release. Fail loudly instead.
      - name: Every platform must be present exactly once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          duplicates=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          if [ "$duplicates" -ne 1 ]; then
            echo "::error::$duplicates releases share the tag $TAG (expected exactly 1)."
            exit 1
          fi

          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$names"
          for pattern in '-setup\.exe$' '\.dmg$'; do
            count=$(printf '%s\n' "$names" | grep -c -- "$pattern" || true)
            if [ "$count" -ne 1 ]; then
              echo "::error::expected exactly 1 asset matching /$pattern/ on $TAG, found $count."
              exit 1
            fi
          done
          echo "Release $TAG carries one installer per platform."
